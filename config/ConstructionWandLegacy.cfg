# Configuration file

general {

    wandlimits {
        # Default max placement count for Diamond Wand
        # Min: 1
        # Max: 4096
        I:diamondWandMaxBlocks=81

        # Default max placement count for Infinity Wand
        # Min: 1
        # Max: 4096
        I:infinityWandMaxBlocks=256

        # Default max placement count for Iron Wand
        # Min: 1
        # Max: 4096
        I:ironWandMaxBlocks=27

        # Default max placement count for Stone Wand
        # Min: 1
        # Max: 4096
        I:stoneWandMaxBlocks=9
    }

    placement {
        # Allow placing blocks with TileEntity via wand
        B:allowTileEntityPlacement=true

        # Placement blacklist entries. Format: modid:block or modid:block@meta.
        S:blockBlacklist <
         >

        # Placement whitelist entries. Format: modid:block or modid:block@meta. Empty = disabled.
        S:blockWhitelist <
         >

        # Whitelist keywords for TARGET mode property copy. Property name containing any keyword will be copied.
        S:propertyCopyWhitelist <
            facing
            axis
            rotation
            half
            hinge
            shape
            part
            face
         >
    }

    matching {
        # Similar block matching groups for SIMILAR mode, entries separated by ';', e.g. minecraft:dirt;minecraft:grass
        S:similarBlocks <
         >
    }

    performance {
        # Defer Chunk height-map and skylight-column updates while a wand executes, then merge them per column.
        # Experimental: keep disabled unless large wand operations spend significant time in Chunk.relightBlock.
        # Changing this option requires a full game or server restart so the Chunk Coremod can be applied safely.
        B:deferredLightingUpdates=false
    }

}


